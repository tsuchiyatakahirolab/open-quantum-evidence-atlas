name: Artifact CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-analysis.txt

      - name: Validate code, artifact and notebook
        run: |
          npm run lint
          npm run atlas:ops:test
          npm run notebook:test
          npm test
